<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administratori | Ankand Premium</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: Arial, sans-serif; background: #101827; color: #f8fafc; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .panel { width: 100%; max-width: 440px; background: #1e293b; border: 1px solid #334155; border-radius: 18px; padding: 28px; box-shadow: 0 20px 50px #0005; }
    .panel.wide { max-width: 850px; }
    h1 { margin: 0 0 8px; font-size: 25px; text-align: center; }
    h2 { font-size: 20px; margin: 25px 0 12px; }
    .subtitle { text-align: center; color: #cbd5e1; margin-bottom: 26px; line-height: 1.5; }
    label { display: block; margin: 16px 0 7px; font-weight: bold; }
    input { width: 100%; padding: 13px; border-radius: 9px; border: 1px solid #64748b; background: #0f172a; color: white; font-size: 16px; }
    input:focus { outline: 2px solid #38bdf8; }
    button { width: 100%; padding: 14px; margin-top: 20px; border: 0; border-radius: 9px; background: #fbbf24; color: #111827; font-weight: bold; font-size: 16px; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: wait; }
    .secondary { background: #334155; color: white; }
    .message { margin-top: 18px; text-align: center; line-height: 1.5; min-height: 22px; color: #fca5a5; }
    .success { color: #86efac; }
    .hidden { display: none !important; }
    .info { padding: 15px; background: #0f172a; border-radius: 10px; line-height: 1.8; overflow-wrap: anywhere; }
    .note { color: #cbd5e1; font-size: 14px; line-height: 1.6; margin-top: 20px; }
    .users-list { display: grid; gap: 12px; margin-top: 15px; }
    .user-card { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 15px; line-height: 1.7; overflow-wrap: anywhere; }
    .user-card strong { color: #fbbf24; }
    .user-meta { color: #cbd5e1; font-size: 14px; }
    .users-heading { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    .users-heading h2 { margin-bottom: 0; }
    .count { color: #cbd5e1; font-size: 14px; }
    .account-state { margin-top: 8px; font-size: 14px; font-weight: bold; }
    .account-state.blocked { color: #fca5a5; }
    .account-state.allowed { color: #86efac; }
    .account-action { margin-top: 12px; padding: 11px; font-size: 14px; }
    .account-action.block-action { background: #fca5a5; color: #111827; }
    .account-action.unblock-action { background: #86efac; color: #111827; }
    .card-message { min-height: 0; margin-top: 8px; text-align: left; font-size: 14px; }
    button:focus-visible { outline: 3px solid #38bdf8; outline-offset: 3px; }
  </style>
</head>
<body>
  <main id="mainPanel" class="panel">
    <section id="loginView">
      <h1>Paneli i Administratorit</h1>
      <p class="subtitle">Ankand Premium Shqipëri – Kosovë</p>
      <form id="loginForm">
        <label for="username">Emri i përdoruesit</label>
        <input id="username" name="username" type="text" value="admin_admin" autocomplete="username" minlength="3" maxlength="30" required>
        <label for="password">Fjalëkalimi</label>
        <input id="password" name="password" type="password" autocomplete="current-password" minlength="12" maxlength="72" required>
        <button id="loginButton" type="submit">Hyr si administrator</button>
      </form>
      <p id="loginMessage" class="message" role="status"></p>
    </section>

    <section id="dashboardView" class="hidden">
      <h1>Paneli i Administratorit</h1>
      <p class="subtitle">Mirë se erdhe në administrim</p>
      <div class="info">
        <div><strong>Përdoruesi:</strong> <span id="adminName"></span></div>
        <div><strong>Roli:</strong> <span id="adminRole"></span></div>
        <div><strong>Sesioni skadon:</strong> <span id="sessionExpiry"></span></div>
      </div>
      <p class="note">Shiko përdoruesit e regjistruar. Vetëm super_admin mund të bllokojë ose zhbllokojë llogari. Veprimet kërkojnë konfirmim.</p>
      <button id="usersButton" type="button">Përdoruesit</button>
      <section id="usersView" class="hidden" aria-label="Lista e përdoruesve">
        <div class="users-heading"><h2>Lista e përdoruesve</h2><span id="usersCount" class="count"></span></div>
        <p id="usersMessage" class="message" role="status"></p>
        <div id="usersList" class="users-list"></div>
      </section>
      <button id="logoutButton" class="secondary" type="button">Dil nga administrimi</button>
      <p id="dashboardMessage" class="message" role="status"></p>
    </section>
  </main>

  <script>
    "use strict";

    const API = "https://bhwidixijfuhylbanjuk.supabase.co/functions/v1/admin-auth";
    const USERS_API = "https://bhwidixijfuhylbanjuk.supabase.co/functions/v1/admin-users";

    const mainPanel = document.getElementById("mainPanel");
    const loginView = document.getElementById("loginView");
    const dashboardView = document.getElementById("dashboardView");
    const loginForm = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");
    const loginMessage = document.getElementById("loginMessage");
    const dashboardMessage = document.getElementById("dashboardMessage");
    const logoutButton = document.getElementById("logoutButton");
    const usersButton = document.getElementById("usersButton");
    const usersView = document.getElementById("usersView");
    const usersList = document.getElementById("usersList");
    const usersMessage = document.getElementById("usersMessage");
    const usersCount = document.getElementById("usersCount");

    // Tokeni mbahet vetëm në memorien e faqes, jo në localStorage.
    let sessionToken = null;
    let adminRole = null;
    let currentUsers = [];
    let actionInProgress = false;
    let requestVersion = 0;

    async function apiRequest(body) {
      const response = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
        cache: "no-store"
      });
      let result;
      try { result = await response.json(); }
      catch { throw new Error("Përgjigje e pavlefshme nga serveri."); }
      if (!response.ok) {
        if (response.status === 401) throw new Error("Të dhënat e hyrjes nuk janë të sakta.");
        if (response.status === 429) throw new Error("Shumë tentativa. Provo më vonë.");
        throw new Error("Shërbimi nuk është i disponueshëm.");
      }
      return result;
    }

    function clearUsers() {
      usersView.classList.add("hidden");
      usersList.replaceChildren();
      currentUsers = [];
      usersMessage.textContent = "";
      usersMessage.classList.remove("success");
      usersCount.textContent = "";
      usersButton.disabled = false;
      usersButton.textContent = "Përdoruesit";
      mainPanel.classList.remove("wide");
    }

    function showLogin() {
      requestVersion++;
      sessionToken = null;
      adminRole = null;
      actionInProgress = false;
      clearUsers();
      dashboardView.classList.add("hidden");
      loginView.classList.remove("hidden");
      document.getElementById("password").value = "";
    }

    function showDashboard(admin, expiresAt) {
      adminRole = admin.role;
      document.getElementById("adminName").textContent = admin.username;
      document.getElementById("adminRole").textContent = admin.role;
      document.getElementById("sessionExpiry").textContent = new Date(expiresAt).toLocaleString("sq-AL");
      dashboardMessage.textContent = "";
      loginView.classList.add("hidden");
      dashboardView.classList.remove("hidden");
    }

    function addField(card, label, value) {
      const line = document.createElement("div");
      line.className = "user-meta";
      const name = document.createElement("strong");
      name.textContent = label + ": ";
      const content = document.createElement("span");
      content.textContent = value == null || value === "" ? "—" : String(value);
      line.append(name, content);
      card.appendChild(line);
    }

    function accessStatus(access) {
      if (!access) return "Pa të dhëna aksesi";
      if (access.payment_suspended) return "I pezulluar";
      if (access.unlimited_access) return "Akses i pakufizuar";
      const now = Date.now();
      const complimentary = Date.parse(access.complimentary_until || "");
      const subscription = Date.parse(access.subscription_ends_at || "");
      if (complimentary > now) return "Akses falas aktiv";
      if (subscription > now) return "Abonim aktiv";
      return "Pa akses aktiv";
    }

    function renderUsers(users) {
      currentUsers = users;
      usersList.replaceChildren();
      usersCount.textContent = users.length + " përdorues";
      usersMessage.classList.remove("success");
      if (!users.length) {
        usersMessage.textContent = "Nuk u gjet asnjë përdorues.";
        return;
      }
      usersMessage.textContent = "";
      for (const user of users) {
        const card = document.createElement("article");
        card.className = "user-card";
        const heading = document.createElement("div");
        const strong = document.createElement("strong");
        const displayName = [user.first_name, user.last_name]
          .filter(Boolean).join(" ") || "Pa emër";
        strong.textContent = displayName;
        heading.appendChild(strong);
        card.appendChild(heading);
        addField(card, "Qyteti", user.city);
        addField(card, "Telefoni", user.phone);
        addField(card, "Aksesi në ankande", accessStatus(user.access));
        addField(card, "ID", user.user_id);

        const status = document.createElement("div");
        status.className = "account-state " +
          (user.blocked ? "blocked" : "allowed");
        status.textContent = user.blocked
          ? "Llogaria: E bllokuar"
          : "Llogaria: E pabllokuar";
        card.appendChild(status);

        if (adminRole === "super_admin") {
          const actionButton = document.createElement("button");
          actionButton.type = "button";
          actionButton.className = "account-action " +
            (user.blocked ? "unblock-action" : "block-action");
          actionButton.textContent = user.blocked
            ? "Zhblloko" : "Blloko llogarinë";
          const actionMessage = document.createElement("p");
          actionMessage.className = "message card-message";
          actionMessage.setAttribute("role", "status");
          actionButton.addEventListener("click", () =>
            changeAccountStatus(user, displayName, actionButton, actionMessage)
          );
          card.append(actionButton, actionMessage);
        }
        usersList.appendChild(card);
      }
    }

    async function changeAccountStatus(user, displayName, button, message) {
      if (!sessionToken || adminRole !== "super_admin" || actionInProgress) return;
      if (typeof user.user_id !== "string") return;
      const action = user.blocked ? "unblock" : "block";
      const question = action === "block"
        ? `A dëshiron të BLLOKOSH llogarinë e ${displayName}?\nID: ${user.user_id}`
        : `A dëshiron të ZHBLLOKOSH llogarinë e ${displayName}?\nID: ${user.user_id}`;
      if (!window.confirm(question)) return;

      const token = sessionToken;
      const version = requestVersion;
      actionInProgress = true;
      button.disabled = true;
      message.classList.remove("success");
      message.textContent = "Duke ruajtur ndryshimin…";
      try {
        const response = await fetch(USERS_API, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token
          },
          body: JSON.stringify({ action, user_id: user.user_id }),
          cache: "no-store"
        });
        let result;
        try { result = await response.json(); }
        catch { throw new Error("Përgjigje e pavlefshme nga serveri."); }
        if (version !== requestVersion || token !== sessionToken) return;
        if (response.status === 401) {
          showLogin();
          loginMessage.textContent = "Sesioni ka skaduar. Hyr përsëri.";
          return;
        }
        if (response.status === 403) throw new Error("Nuk ke leje për këtë veprim.");
        if (!response.ok || result.ok !== true || result.action !== action ||
            result.user_id !== user.user_id) {
          throw new Error("Ndryshimi nuk u konfirmua nga serveri.");
        }
        user.blocked = action === "block";
        renderUsers(currentUsers);
        usersMessage.classList.add("success");
        usersMessage.textContent = action === "block"
          ? `Llogaria e ${displayName} u bllokua.`
          : `Llogaria e ${displayName} u zhbllokua.`;
      } catch (error) {
        if (version === requestVersion && token === sessionToken) {
          message.textContent = error.message || "Ndryshimi dështoi.";
        }
      } finally {
        actionInProgress = false;
        if (version === requestVersion && token === sessionToken) button.disabled = false;
      }
    }

    loginForm.addEventListener("submit", async function (event) {
      event.preventDefault();
      loginMessage.textContent = "";
      loginButton.disabled = true;
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      try {
        const result = await apiRequest({ action: "login", username, password });
        if (typeof result.token !== "string" || !result.admin || !result.expires_at) {
          throw new Error("Përgjigje e paplotë nga serveri.");
        }
        sessionToken = result.token;
        document.getElementById("password").value = "";
        showDashboard(result.admin, result.expires_at);
      } catch (error) {
        loginMessage.textContent = error.message || "Hyrja dështoi.";
      } finally {
        loginButton.disabled = false;
      }
    });

    usersButton.addEventListener("click", async function () {
      if (!sessionToken) {
        showLogin();
        return;
      }
      if (!usersView.classList.contains("hidden")) {
        if (actionInProgress) return;
        requestVersion++;
        clearUsers();
        return;
      }
      usersView.classList.remove("hidden");
      mainPanel.classList.add("wide");
      usersButton.disabled = true;
      usersMessage.textContent = "Duke ngarkuar përdoruesit…";
      const version = ++requestVersion;
      const token = sessionToken;
      try {
        const response = await fetch(USERS_API, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token
          },
          body: JSON.stringify({}),
          cache: "no-store"
        });
        let result;
        try { result = await response.json(); }
        catch { throw new Error("Përgjigje e pavlefshme nga serveri."); }
        if (version !== requestVersion || token !== sessionToken) return;
        if (response.status === 401) {
          showLogin();
          loginMessage.textContent = "Sesioni ka skaduar. Hyr përsëri.";
          return;
        }
        if (response.status === 403) throw new Error("Nuk ke leje për të parë përdoruesit.");
        if (!response.ok) throw new Error("Lista e përdoruesve nuk u ngarkua.");
        if (!Array.isArray(result.users)) throw new Error("Formati i listës është i pavlefshëm.");
        renderUsers(result.users);
        usersButton.textContent = "Mbyll listën e përdoruesve";
      } catch (error) {
        if (version === requestVersion && token === sessionToken) {
          usersMessage.textContent = error.message || "Gabim gjatë ngarkimit.";
        }
      } finally {
        if (version === requestVersion && token === sessionToken) usersButton.disabled = false;
      }
    });

    logoutButton.addEventListener("click", async function () {
      dashboardMessage.textContent = "";
      logoutButton.disabled = true;
      try {
        if (sessionToken) await apiRequest({ action: "logout", token: sessionToken });
        showLogin();
      } catch {
        dashboardMessage.textContent = "Dalja në server dështoi. Mbyll faqen dhe provo përsëri.";
      } finally {
        logoutButton.disabled = false;
      }
    });

    // Kur mbyllet ose rifreskohet faqja, tokeni nuk ruhet.
    showLogin();
  </script>
</body>
</html>
